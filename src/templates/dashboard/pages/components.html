{% extends 'dashboard/base.html' %}

{% block head_title %}{{ title }} - {{ block.super }}{% endblock head_title %}

{% block content %}
<div class="px-4 py-8 max-w-7xl mx-auto w-full">
    <div class="mb-8">
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">{{ title }}</h2>
        <p class="text-sm text-slate-500 mt-1">UI kits and design tokens.</p>
    </div>
    
    <div class="bg-white border border-slate-200 rounded-xl p-16 text-center shadow-sm">
        <div class="w-16 h-16 bg-slate-50 border border-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path></svg>
        </div>
        <h3 class="text-xl font-semibold text-slate-900">Component Library</h3>
        <p class="text-slate-500 mt-2 max-w-sm mx-auto text-sm">Explore our curated list of Tailwind components, launching soon.</p>
    </div>
</div>
{% endblock content %}
