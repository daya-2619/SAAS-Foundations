{% extends 'dashboard/base.html' %}

{% block head_title %}{{ title }} - {{ block.super }}{% endblock head_title %}

{% block content %}
<div class="px-4 py-8 max-w-7xl mx-auto w-full">
    <div class="mb-8">
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">{{ title }}</h2>
        <p class="text-sm text-slate-500 mt-1">Get support and contact our team.</p>
    </div>
    
    <div class="bg-white border border-slate-200 rounded-xl p-16 text-center shadow-sm">
        <div class="w-16 h-16 bg-slate-50 border border-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </div>
        <h3 class="text-xl font-semibold text-slate-900">Support Center</h3>
        <p class="text-slate-500 mt-2 max-w-sm mx-auto text-sm">Need help? Our ticketing system is being configured to assist you better.</p>
    </div>
</div>
{% endblock content %}
