{% extends 'dashboard/base.html' %}

{% block head_title %}{{ title }} - {{ block.super }}{% endblock head_title %}

{% block content %}
<div class="px-4 py-8 max-w-7xl mx-auto w-full">
    <div class="mb-8">
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">{{ title }}</h2>
        <p class="text-sm text-slate-500 mt-1">Communicate with your team and users.</p>
    </div>
    
    <div class="bg-white border border-slate-200 rounded-xl p-16 text-center shadow-sm">
        <div class="w-16 h-16 bg-slate-50 border border-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        </div>
        <h3 class="text-xl font-semibold text-slate-900">Unified Inbox</h3>
        <p class="text-slate-500 mt-2 max-w-sm mx-auto text-sm">Real-time messaging is being provisioned and will be ready soon.</p>
    </div>
</div>
{% endblock content %}
